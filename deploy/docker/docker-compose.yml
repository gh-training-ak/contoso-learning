services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Contoso: "Server=sql,1433;Database=Contoso;User Id=sa;Password=${SQL_PASSWORD:?set SQL_PASSWORD};TrustServerCertificate=True"
      Redis__ConnectionString: "cache:6379"
    depends_on:
      sql:
        condition: service_healthy
      cache:
        condition: service_started

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm start -- --host 0.0.0.0"
    volumes:
      - ../../web:/app
    ports:
      - "4200:4200"

  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?set SQL_PASSWORD}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1'"]
      interval: 10s
      retries: 10

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
