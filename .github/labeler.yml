area/api:
  - changed-files:
      - any-glob-to-any-file: ['src/Contoso.Api/**']

area/domain:
  - changed-files:
      - any-glob-to-any-file: ['src/Contoso.Domain/**']

area/web:
  - changed-files:
      - any-glob-to-any-file: ['web/**']

area/infrastructure:
  - changed-files:
      - any-glob-to-any-file: ['infra/**', 'deploy/**']

area/database:
  - changed-files:
      - any-glob-to-any-file: ['database/**']

area/ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/workflows/**']

documentation:
  - changed-files:
      - any-glob-to-any-file: ['docs/**', '**/*.md']

tests:
  - changed-files:
      - any-glob-to-any-file: ['tests/**', '**/*.spec.ts']
