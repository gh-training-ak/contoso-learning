name: Bug report
description: Something behaves differently from what the docs say.
title: "[bug]: "
labels: [kind/bug, status/triage]
projects: ["gh-training-ak/1"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this. Please search existing issues first.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API
        - Web
        - Database
        - Infrastructure
        - CI
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [dev, test, prod, local]
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA.
      placeholder: v3.1.0
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the request, the response and anything from the logs.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched open and closed issues.
          required: true
        - label: I removed customer data from the logs above.
          required: true
