name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, test, prod]

permissions:
  contents: read
  id-token: write

jobs:
  dev:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://dev.contoso.example
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform apply
        working-directory: infra/terraform
        run: |
          terraform init
          terraform apply -auto-approve -var-file=envs/dev.tfvars

  test:
    needs: dev
    runs-on: ubuntu-latest
    environment:
      name: test
      url: https://test.contoso.example
    steps:
      - uses: actions/checkout@v4
      - run: echo "Promoting the digest validated in dev."

  prod:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://learn.contoso.example
    steps:
      - uses: actions/checkout@v4
      - run: echo "Waiting on the two required reviewers configured on this environment."
