name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, test, prod]

permissions:
  contents: read
  id-token: write

# Deployments are off in this repository. There is no Azure subscription behind it,
# so the sign in step is skipped and the plan is printed instead of applied.
# Set the repository variable DEPLOYMENTS_ENABLED to true and add the three OIDC
# values to turn it on.
env:
  ENABLED: ${{ vars.DEPLOYMENTS_ENABLED == 'true' }}

jobs:
  dev:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://dev.contoso.example
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Validate the stack
        working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Sign in to Azure
        if: env.ENABLED == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Apply
        if: env.ENABLED == 'true'
        working-directory: infra/terraform
        run: |
          terraform init
          terraform apply -auto-approve -var-file=envs/dev.tfvars

      - name: Deployments are disabled
        if: env.ENABLED != 'true'
        run: |
          echo "### dev" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Terraform validated. Nothing applied, DEPLOYMENTS_ENABLED is not set." >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: dev
    runs-on: ubuntu-latest
    environment:
      name: test
      url: https://test.contoso.example
    steps:
      - name: Promote the digest validated in dev
        run: |
          echo "### test" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The platform team approved this environment before the job started." >> "$GITHUB_STEP_SUMMARY"

  prod:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://learn.contoso.example
    steps:
      - name: Promote the digest validated in test
        run: |
          echo "### prod" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "An approval and a ten minute wait timer cleared before this ran." >> "$GITHUB_STEP_SUMMARY"
