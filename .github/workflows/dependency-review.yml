name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          comment-summary-in-pr: always
          # Angular 18 drags in transitive dev dependencies with moderate advisories.
          # They do not reach the browser bundle. Gate on critical, read the comment for the rest.
          deny-licenses: GPL-3.0, AGPL-3.0
