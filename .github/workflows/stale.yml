name: Stale

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 45
          days-before-close: 14
          stale-issue-label: status/stale
          stale-pr-label: status/stale
          exempt-issue-labels: 'status/blocked,priority/p0,kind/epic'
          exempt-pr-labels: 'status/blocked'
          stale-issue-message: >
            No activity on this issue for 45 days. It will close in 14 days unless
            someone comments or adds the status/blocked label.
          stale-pr-message: >
            This pull request has been quiet for 45 days. Rebase it or close it.
